[project]
name = "l2d-science"
version = "0.1.0"
description = "Development-only scripts for the science gate (task 2.1) of the npu-log-decision spec. Not part of the l2d tool."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "torch==2.15.0",
    "onnx==1.23.2",
    "onnxruntime==1.31.1",
    "scikit-learn==1.9.1",    "scipy==1.18.1",
]

[tool.uv]
package = false
