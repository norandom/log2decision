# log2decision workspace.
#
# Dependency direction between crates is fixed (design.md, "Architecture Integration"):
#   l2d-core -> l2d-baseline, l2d-encoder, l2d-store -> l2d-train, l2d-decide
#            -> l2d-assess -> l2d-eval -> l2d-cli
# A crate imports only from crates earlier in this order.
#
# Build output must stay off the repository. Set CARGO_TARGET_DIR (reference host:
# D:\BuildArtifacts\cargo-target) before building. The path is deliberately not hard-coded
# in a .cargo/config.toml so the workspace still builds on other machines; instead the
# l2d-core build script prints a warning when the build output lands inside the repository.

[workspace]
resolver = "3"
members = [
    "crates/l2d-core",
    "crates/l2d-baseline",
    "crates/l2d-encoder",
    "crates/l2d-store",
    "crates/l2d-train",
    "crates/l2d-decide",
    "crates/l2d-assess",
    "crates/l2d-eval",
    "crates/l2d-cli",
]
# l2d-train (offline training, later `burn`) is optional: it is left out of the default
# build and is only built with `--workspace` or `-p l2d-train`.
default-members = [
    "crates/l2d-core",
    "crates/l2d-baseline",
    "crates/l2d-encoder",
    "crates/l2d-store",
    "crates/l2d-decide",
    "crates/l2d-assess",
    "crates/l2d-eval",
    "crates/l2d-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
l2d-core = { path = "crates/l2d-core" }
l2d-baseline = { path = "crates/l2d-baseline" }
l2d-encoder = { path = "crates/l2d-encoder" }
l2d-store = { path = "crates/l2d-store" }
l2d-train = { path = "crates/l2d-train" }
l2d-decide = { path = "crates/l2d-decide" }
l2d-assess = { path = "crates/l2d-assess" }
l2d-eval = { path = "crates/l2d-eval" }

clap = { version = "4", features = ["derive"] }
csv = "1"
# The one tabular data layer (design.md, "Data layer"). Default features are off: only the
# CSV and JSON-lines readers, lazy queries and `ndarray` conversion. No cloud, HTTP,
# async or object-store feature may be enabled (requirement 10.2). Other crates import
# Polars through `l2d_core::polars`, not as a dependency of their own.
#
# Two things here are deliberate and must be re-checked with
# `cargo tree -p l2d-core -e normal` whenever the version or the features change:
# - The readers are enabled on `polars-io`, not through the facade features `csv` and
#   `json`. From 0.47 on those facade features imply `streaming`, which together with
#   `lazy` links `polars-stream` and through it `reqwest`, `hyper`, `object_store` and
#   `rustls`.
# - The version is 0.52.0, not the latest release (0.55.2 on 2026-11-11). From 0.53 on
#   this feature set links `tokio` with its `net` feature (`mio`, `socket2`), and from
#   0.54 on `polars-core` itself depends on it, whatever the features.
# With this entry neither the dependency tree nor `Cargo.lock` names a network crate.
polars = { version = "=0.52.0", default-features = false, features = ["lazy", "polars-io", "ndarray"] }
polars-io = { version = "=0.52.0", default-features = false, features = ["csv", "json"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Only the call that reports the free physical memory (requirement 12.1). The crate is
# already in the dependency tree through Polars; no other feature is enabled here.
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

# Numerical solver of the baseline logistic regression (requirement 2.7). `argmin` is the
# optimizer `linfa-logistic` itself is built on; it is used directly because
# `linfa-logistic` 0.8 fits dense matrices only. Pure Rust: no BLAS/LAPACK backend, no
# thread pool, no random number source enabled.
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", default-features = false, features = ["ndarray_v0_16-nolinalg"] }
ndarray = { version = "0.16", default-features = false, features = ["std"] }
# The conformal calibration layer (requirement 11, task 1.13; project decision of
# 2026-11-11). Wrapped in `l2d-decide` (`conformal.rs`), the only crate that may name it.
# Pinned exactly: the wrapper relies on the p-value formula and the tie rule of
# `ConformalPredictor::predict`, which a test compares with a direct computation.
#
# The crate has no features, so everything below is linked whatever is used
# (`cargo tree -p conformal-prediction -e normal`, 2026-11-12). `Cargo.lock` grows by
# three packages, from 196 to 199: the crate itself, `lean-agentic` and `ndarray` 0.17.
# - `lean-agentic` 0.1.0: no dependencies of its own, no build script, no `unsafe`, no
#   file, process or network access. Every `ConformalPredictor` creates its (empty)
#   term arena, symbol table and environment, so this code does run.
# - `rand` 0.8.8 with `rand_chacha` 0.3.1, `rand_core` 0.6.4, `ppv-lite86`, `zerocopy`
#   and `getrandom` 0.2.17 (reads the operating system's random source, no network).
#   These were in `Cargo.lock` already, but only for the tests of `l2d-baseline`
#   (through `linfa`); with this entry they are linked into the tool. The crate uses
#   them only in `cpd::distribution` (sampling) and `pcp::clustering` (k-means start);
#   `l2d` calls neither, so no random number is drawn.
# - `ndarray` 0.17.2 (with `matrixmultiply`, `num-complex`, `num-integer`, `rawpointer`,
#   already present), a second copy next to the 0.16 of Polars and the regression. Used
#   by the crate's `pcp` and `cpd` modules only; build weight for `l2d`.
# `l2d` uses `ConformalPredictor` and `NonconformityMeasure` only. Not reviewed by the
# owner yet (handover, "Open points").
conformal-prediction = "=2.0.1"
# Test-only reference implementation for the dense path.
linfa = "0.8.1"
linfa-logistic = "0.8.1"

# Dependencies are built without debug information; the workspace's own crates keep it.
# With it, `polars-core` alone is a 1.1 GB library and every test binary that links
# `l2d-core` gets a program database of 0.4 to 1 GB. Linking the test binaries of the
# workspace in parallel then exhausted the memory of the reference host from time to
# time (`link.exe` failed with 0xe0000001).
[profile.dev.package."*"]
debug = false
