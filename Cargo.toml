# log2decision workspace.
#
# Dependency direction between crates is fixed (design.md, "Architecture Integration"):
#   l2d-core -> l2d-baseline, l2d-encoder, l2d-store -> l2d-train, l2d-decide
#            -> l2d-assess -> l2d-eval -> l2d-cli
# A crate imports only from crates earlier in this order.
#
# Build output must stay off the repository. Set CARGO_TARGET_DIR (reference host:
# D:\BuildArtifacts\cargo-target) before building. The path is deliberately not hard-coded
# in a .cargo/config.toml so the workspace still builds on other machines; instead the
# l2d-core build script prints a warning when the build output lands inside the repository.

[workspace]
resolver = "3"
members = [
    "crates/l2d-core",
    "crates/l2d-baseline",
    "crates/l2d-encoder",
    "crates/l2d-store",
    "crates/l2d-train",
    "crates/l2d-decide",
    "crates/l2d-assess",
    "crates/l2d-eval",
    "crates/l2d-cli",
]
# l2d-train (offline training, later `burn`) is optional: it is left out of the default
# build and is only built with `--workspace` or `-p l2d-train`.
default-members = [
    "crates/l2d-core",
    "crates/l2d-baseline",
    "crates/l2d-encoder",
    "crates/l2d-store",
    "crates/l2d-decide",
    "crates/l2d-assess",
    "crates/l2d-eval",
    "crates/l2d-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
l2d-core = { path = "crates/l2d-core" }
l2d-baseline = { path = "crates/l2d-baseline" }
l2d-encoder = { path = "crates/l2d-encoder" }
l2d-store = { path = "crates/l2d-store" }
l2d-train = { path = "crates/l2d-train" }
l2d-decide = { path = "crates/l2d-decide" }
l2d-assess = { path = "crates/l2d-assess" }
l2d-eval = { path = "crates/l2d-eval" }

clap = { version = "4", features = ["derive"] }
csv = "1"
# The one tabular data layer (design.md, "Data layer"). Default features are off: only the
# CSV and JSON-lines readers, lazy queries and `ndarray` conversion. No cloud, HTTP,
# async or object-store feature may be enabled (requirement 10.2). Other crates import
# Polars through `l2d_core::polars`, not as a dependency of their own.
#
# Two things here are deliberate and must be re-checked with
# `cargo tree -p l2d-core -e normal` whenever the version or the features change:
# - The readers are enabled on `polars-io`, not through the facade features `csv` and
#   `json`. From 0.47 on those facade features imply `streaming`, which together with
#   `lazy` links `polars-stream` and through it `reqwest`, `hyper`, `object_store` and
#   `rustls`.
# - The version is 0.52.0, not the latest release (0.55.2 on 2026-11-11). From 0.53 on
#   this feature set links `tokio` with its `net` feature (`mio`, `socket2`), and from
#   0.54 on `polars-core` itself depends on it, whatever the features.
# With this entry neither the dependency tree nor `Cargo.lock` names a network crate.
polars = { version = "=0.52.0", default-features = false, features = ["lazy", "polars-io", "ndarray"] }
polars-io = { version = "=0.52.0", default-features = false, features = ["csv", "json"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Only the call that reports the free physical memory (requirement 12.1). The crate is
# already in the dependency tree through Polars; no other feature is enabled here.
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

# Numerical solver of the baseline logistic regression (requirement 2.7). `argmin` is the
# optimizer `linfa-logistic` itself is built on; it is used directly because
# `linfa-logistic` 0.8 fits dense matrices only. Pure Rust: no BLAS/LAPACK backend, no
# thread pool, no random number source enabled.
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", default-features = false, features = ["ndarray_v0_16-nolinalg"] }
ndarray = { version = "0.16", default-features = false, features = ["std"] }
# The conformal calibration layer (requirement 11) has no dependency of its own: it is
# own code in `l2d-decide` (`conformal.rs`). Task 1.13 used the crate
# `conformal-prediction` =2.0.1 for the p-value count; task 1.18 replaced it (owner
# decision of 2026-11-12), and `l2d-decide/tests/conformal_fixture.rs` holds the results
# to what that crate gave. With the entry, `conformal-prediction`, `lean-agentic` 0.1.0
# and the second `ndarray` (0.17.2) left `Cargo.lock`. `rand` 0.8.8 with `rand_chacha`
# 0.3.1 and `rand_core` 0.6.4 stay in the lock file for the tests of `l2d-baseline` only
# (through `linfa`, below) and are no longer linked into the tool. `getrandom` 0.2.17,
# `ppv-lite86` and `zerocopy` are still linked into the tool through Polars, as before.
# The embedded store (requirement 5, task 1.8). Used by `l2d-store` only.
#
# The design asks for `rusqlite` 0.32 with the features `bundled` and `fts5`. Release
# 0.32 has no feature called `fts5`: `bundled` compiles the SQLite source that ships in
# `libsqlite3-sys` (SQLite 3.46.0) with `SQLITE_ENABLE_FTS5` set, so the text-search
# extension is always there. A test of `l2d-store` asserts the compile option and the
# `trigram` tokenizer, so a change of this entry that loses them fails the build's tests.
#
# What it brings in (`cargo tree -p rusqlite -e normal,build`, 2026-11-12). `Cargo.lock`
# grows by seven packages, from 199 to 206 (203 since task 1.18 removed three):
# - `rusqlite` 0.32.1 and `libsqlite3-sys` 0.30.1 (the SQLite C source, compiled by `cc`,
#   which was in the lock file already, and linked statically).
# - `pkg-config` 0.3.34 and `vcpkg` 0.2.15: build dependencies of `libsqlite3-sys` that
#   are compiled but not consulted with `bundled`.
#   Two environment variables of the build can change what is linked, whatever this
#   entry says: `LIBSQLITE3_SYS_USE_PKG_CONFIG` links a system SQLite in place of the
#   bundled source, and `LIBSQLITE3_FLAGS` adds or removes compile options of the bundled
#   source. Neither is set on the reference host. The test compares the version the
#   linked library reports with the version of the bundled header and pins it (3.46.0),
#   so a system library of another version fails it; a system library of exactly that
#   version, or changed compile options other than FTS5, would not be noticed.
# - `hashlink` 0.9.1 (the prepared-statement cache) with a third `hashbrown` (0.14.5,
#   next to 0.16 and 0.17); its `ahash` 0.8.12 (seeded from the operating system's
#   random source through `getrandom`, no network) was in the lock file already.
# - `fallible-iterator` 0.3.0; `fallible-streaming-iterator`, `bitflags` and `smallvec`
#   were present already.
# No feature beyond `bundled` is enabled: no `load_extension`, no `url`, `chrono`,
# `serde_json` or `csv` integration, no SQLCipher (which would bring OpenSSL). The C
# source is compiled with `SQLITE_ENABLE_LOAD_EXTENSION`, but loading an extension is
# switched off per connection by default and `l2d-store` does not switch it on (the
# binding's functions for that need its `load_extension` feature). SQLite has no network
# code; the guard test over `Cargo.lock` stays green.
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
# The exact vector search of the store (requirement 5.3, task 1.9). Used by `l2d-store`
# only: the squared L2 distance is the product of the difference of two vectors with
# itself, computed by faer's SIMD kernel (`faer::linalg::matmul::dot::inner_prod`).
#
# Default features are off; only `std` is on, which gives the kernels their run-time
# choice of SIMD width (through `pulp`). Left off: `rayon` (faer's own use of a thread
# pool; the search runs on the calling thread), `sparse-linalg`, `rand` and `npy`
# (reading and writing .npy files).
#
# What it brings in (`cargo tree -p faer -e normal,build --target x86_64-pc-windows-msvc`,
# 2026-11-12). `Cargo.lock` grows by 44 packages, from 203 to 247:
# - 32 that are compiled on the reference host: `faer` 0.24.4 and `faer-traits` 0.24.0;
#   the matrix-product kernels `gemm` 0.19.0 with `gemm-common`, `gemm-f32`, `gemm-f64`,
#   `gemm-c32`, `gemm-c64`, `nano-gemm` 0.2.2 with `nano-gemm-core`, `-codegen`, `-f32`,
#   `-f64`, `-c32`, `-c64`, and `private-gemm-x86` 0.1.22 with `defer`, `interpol` (a
#   macro, which brings a second `syn`, 1.0.109) and `num_cpus` 1.17.0 (the number of
#   processors); the SIMD layer `pulp` 0.22.3 with `pulp-wasm-simd-flag`; `qd` 0.8.0
#   (double-double numbers, a type faer supports); `dyn-stack` with `dyn-stack-macros`,
#   `equator` 0.6.0 and 0.2.2 with their macros, `generativity`, `reborrow` and
#   `seq-macro`. `bytemuck`, `libm`, `num-complex`, `num-traits`, `raw-cpuid` (CPU
#   feature and cache detection) and `once_cell` were present already.
# - 12 that are in the lock file for other targets or features and are not compiled
#   here: `gemm-f16` with `half` and `crunchy`; `sysctl` (cache sizes on macOS) with
#   `walkdir`, `same-file`, `winapi-util`, `byteorder`, `enum-as-inner`, `thiserror`
#   1.0.69 and `thiserror-impl`; `hermit-abi` (for `num_cpus`).
# None of them opens a network connection, and none is in the list of the guard test
# over `Cargo.lock`, which stays green. faer's kernels are "non portable across
# platforms" by their own description: a distance can differ in its last bits between
# CPUs of different SIMD widths, never between runs on one host.
faer = { version = "0.24", default-features = false, features = ["std"] }
# ONNX Runtime binding (requirement 4, hardware gate of task 2.2). So far a
# dev-dependency of `l2d-encoder` only: the gate test `tests/npu_gate.rs` is its one user.
#
# - The version is pinned: 2.0.0-rc.15 is a release candidate (there is no stable 2.x),
#   and it wraps ONNX Runtime 1.31. AMD's Ryzen AI 1.9 ships ONNX Runtime 1.30.0, so the
#   feature `api-30` is set: `ort` then asks the DLL for API level 30. With the default
#   `api-31` the DLL in `runtime/ryzenai/` would be refused at load.
# - Default features are off. The defaults include `download-binaries` and `tls-native`,
#   which make the build script of `ort-sys` fetch a runtime over HTTPS (`ureq`,
#   `native-tls`), and `copy-dylibs`. None of that is wanted: the runtime is AMD's own
#   DLL, loaded at run time from `runtime/ryzenai/` (`load-dynamic`), and nothing is
#   linked or downloaded at build time. `vitis` only compiles the provider's option
#   names; `std` is needed for paths and for `load-dynamic`. `ndarray`, `tracing` and
#   `fetch-models` are off.
# - What it brings in (`cargo tree -p ort -e all --target all`, 2026-11-12): `ort`,
#   `ort-sys` (no build dependency with these features), `libloading` 0.9.0 (with
#   `cfg-if` and `windows-link`, both present already) and `smallvec` (present already).
#   `Cargo.lock` grows by six packages (from 203 to 209 on its branch; 253 after the
#   merge with task 1.9, which added `faer`): those three, and `ndarray`
#   0.17.2, `tracing` 0.1.44 and `tracing-core` 0.1.36, which are optional dependencies
#   that the feature `std` names (`ndarray?/std`, `tracing?/std`). Cargo records such
#   packages in the lock file, but they are not in the dependency tree and are not
#   compiled (`cargo tree -i ndarray@0.17.2 -e all --target all` and `-i tracing` print
#   nothing). No network crate; the guard test over `Cargo.lock` stays green.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "vitis", "api-30"] }
# Test-only reference implementation for the dense path.
linfa = "0.8.1"
linfa-logistic = "0.8.1"

# Dependencies are built without debug information; the workspace's own crates keep it.
# With it, `polars-core` alone is a 1.1 GB library and every test binary that links
# `l2d-core` gets a program database of 0.4 to 1 GB. Linking the test binaries of the
# workspace in parallel then exhausted the memory of the reference host from time to
# time (`link.exe` failed with 0xe0000001).
[profile.dev.package."*"]
debug = false
