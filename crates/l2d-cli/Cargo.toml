[package]
name = "l2d-cli"
description = "The `l2d` command-line binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "l2d"
path = "src/main.rs"

[dependencies]
l2d-core.workspace = true
l2d-baseline.workspace = true
l2d-decide.workspace = true
l2d-assess.workspace = true
l2d-eval.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

# Write the archives `tests/archive.rs` gives to the binary.
[dev-dependencies]
zip.workspace = true
flate2.workspace = true
# The on-request check of the parts of a run hashes every part and every text.
sha2.workspace = true

[features]
# Measurements only: a counting allocator and, with L2D_HEAP_REPORT set, one line with
# the heap peak on standard error (src/heap.rs). Off by default.
heap-report = []
