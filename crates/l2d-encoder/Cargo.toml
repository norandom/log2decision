[package]
name = "l2d-encoder"
description = "Encoder package format, identity, and execution on NPU or CPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The release of the AMD runtime the tool is built for: AMD Ryzen AI 1.9.0 (owner,
# 2026-11-13: "always forward"). The one feature below is on by default. It stands for
# the manifests a runtime directory may match (`runtime/ryzenai-1.9.0.<source>.manifest.json`,
# one per source of the release) and sets the API level `ort` asks the runtime for (ONNX
# Runtime 1.30). Without it the crate does not compile. `runtime/README.md` names the
# release too, and a test holds it to this; `tools/runtime/provision.py` reads the
# release from the `default` line. A later release would be a second feature here with
# its manifests (how release 1.8.0 was wired and removed: the 2.4 notes in tasks.md).
[features]
default = ["ryzenai-1-9"]
ryzenai-1-9 = ["ort/api-30"]

[dependencies]
l2d-core.workspace = true
# The runtime manifest and the provisioning record are JSON; the full file check hashes.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# The NPU device query (configuration manager) and the file version of a DLL that does
# not match the manifest (version resource, read as data; the DLL is not loaded).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Storage_FileSystem"] }

[dev-dependencies]
ort.workspace = true
# The quality test of task 2.12 (`tests/npu_quality.rs`) fits the linear head with the
# baseline's deterministic logistic regression (its dense path). A dev-dependency only:
# the library does not import from `l2d-baseline`.
l2d-baseline.workspace = true

# Process CPU time and memory, for the throughput measurements of task 2.12.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }
