[package]
name = "l2d-core"
description = "Shared record, label, identity, run-record, path, and error types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
csv.workspace = true
polars.workspace = true
# Only switches the CSV and JSON-lines readers on; the code imports through `polars`.
polars-io.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Zip archives as input (`zip_input.rs`): inflating entries and gzip entries, entry
# patterns.
flate2.workspace = true
glob.workspace = true

# Writes the archives the tests read, and reads them as a second opinion. The tool
# itself does not link it: see the entry in the workspace manifest.
[dev-dependencies]
zip.workspace = true

# Free physical memory of the host (`GlobalMemoryStatusEx`), for batch sizing.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
